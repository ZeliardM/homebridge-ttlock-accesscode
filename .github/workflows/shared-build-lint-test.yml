---
name: Build, Lint, and Test

on:
  workflow_call: {}

concurrency:
  group: build-lint-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_lint_test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson('["22","24"]') }}
    steps:
      - name: Checkout Actions
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node ${{ matrix.node-version }}
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Node Dependencies
        id: install-node-deps
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Lint
        id: lint
        shell: bash
        run: |
          set -euo pipefail
          npm run lint

      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Node Import Test
        id: node-import-test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            try {
              await import('./dist/index.js');
              console.log('Node Import OK');
            } catch (e) {
              console.error(e);
              process.exit(1);
            }
          })();
          NODE

      - name: Package Dry Run
        id: package-dry-run
        shell: bash
        run: |
          set -euo pipefail
          PACK_JSON="$(npm pack --dry-run --json)"
          PACK_JSON="$PACK_JSON" node <<'NODE'
          const [pack] = JSON.parse(process.env.PACK_JSON);
          const files = new Set(pack.files.map((file) => file.path));
          const requiredFiles = [
            'config.schema.json',
            'dist/index.js',
            'homebridge-ui/public/index.html',
            'homebridge-ui/server.js',
            'package.json',
          ];
          const missingFiles = requiredFiles.filter((file) => !files.has(file));
          if (missingFiles.length > 0) {
            console.error(`Package is missing required files: ${missingFiles.join(', ')}`);
            process.exit(1);
          }
          console.log(`Package dry run OK: ${pack.files.length} files`);
          NODE

      - name: Outdated / Audit
        id: outdated-audit
        shell: bash
        run: |
          set -euo pipefail
          npm list --outdated || true
          npm audit || true
