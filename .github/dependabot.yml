version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "15:00"
      timezone: "America/New_York"
    target-branch: "beta"
    labels: ["dependency"]
    assignees: ["ZeliardM"]
    versioning-strategy: "increase"
    commit-message:
      prefix: "npm"
      prefix-development: "npm"
      include: "scope"
    groups:
      typescript-eslint:
        patterns: ["@typescript-eslint/*", "typescript", "ts-essentials"]
      eslint:
        patterns: ["@eslint/js", "eslint"]
      stylistic:
        patterns: ["@stylistic/eslint-plugin"]
      md5:
        patterns: ["@types/md5", "md5"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "15:00"
      timezone: "America/New_York"
    target-branch: "beta"
    assignees: ["ZeliardM"]
    commit-message:
      prefix: "ci"
      include: "scope"