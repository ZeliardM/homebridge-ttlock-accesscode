docs:
  - changed-files:
    - any-glob-to-any-file: '**/*.md'

enhancement:
  - any:
    - changed-files:
      - any-glob-to-any-file: 'src/**/*'
      - any-glob-to-any-file: 'homebridge-ui/**/*'
      - any-glob-to-any-file: 'config.schema.json'
      - any-glob-to-any-file: 'config.sample.json'
    - head-branch:
      - '^feature/.*'
      - '^feat/.*'

dependency:
  - any:
    - changed-files:
      - any-glob-to-any-file: 'package.json'
      - any-glob-to-any-file: 'package-lock.json'

workflow:
  - changed-files:
    - any-glob-to-any-file: '.github/**'

fix:
  - any:
    - head-branch:
      - '^fix/.*'
      - '^hotfix/.*'
      - '.*/fix-.*'

bug:
  - any:
    - head-branch:
      - '^bug/.*'
      - '.*/bug-.*'

breaking-change:
  - head-branch:
    - '.*[bB]reaking.*'
